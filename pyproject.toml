[project]
name = "research-orchestrator"
version = "0.1.0"
description = "Blackheart research orchestrator — agent-first FastAPI service that replaces research-tick.sh and friends. Primary caller is the quant-researcher Claude agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Pinned to known-good majors. We can float minors as needed; majors stay
# pinned because async ecosystems break across them (httpx 1.x, pydantic 3.x).
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "asyncpg>=0.30,<0.31",
    "httpx>=0.27,<0.29",
    "tenacity>=9.0,<10",
    "prometheus-client>=0.21,<0.23",
    "structlog>=24.4,<26",
    "python-json-logger>=2.0,<4",
    # Bayesian search for sweeps (services/sweep.py:next_combo_tpe). Pinned
    # to a single major; TPESampler API has been stable since 3.x.
    "optuna>=4.0,<5",
    # Redis async client — activity pub/sub for real-time frontend streaming.
    # Optional at runtime: when ORCH_REDIS_URL is unset, publish is skipped.
    "redis[asyncio]>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.30",
    "pytest-cov>=5.0,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "respx>=0.21,<0.23",         # httpx mocking
    "pytest-postgresql>=6.1,<8",  # DB fixtures
]

[project.scripts]
# `python -m orchestrator` runs the FastAPI app via uvicorn. Same code path
# whether invoked from systemd, Windows service, or `uv run`.
orchestrator = "orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

# ── Tooling ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# B008 is fine in FastAPI (Depends() in default args is the framework idiom)
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# asyncpg has no stubs; tolerate that boundary instead of writing them
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: requires running JVM + DB (skipped in unit-test default)",
]
